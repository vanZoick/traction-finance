<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Seu dinheiro em uma tela só: entradas, saídas, cartões, dívidas, reserva e quanto dá para gastar hoje.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#022E28">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icone-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Traction">
<title>Traction Finance (beta.v1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Urbanist:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral navy fixa + grade de cartões claros; no celular vira navegação inferior. */
:root{
  --sidebar:#FFFFFF; --sidebar-2:#F1F3F3; --sidebar-ink:#062F28; --sidebar-dim:#7C8C87; --sidebar-line:#E6E9EA;
  --bg:#ECEDEF; --surface:#FFFFFF; --surface-2:#F5F6F7; --surface-3:#E3E6E7;
  --past-a:#E7F7DA; --past-b:#DCF2EC; --past-c:#EAF0D9; --past-ink:#062F28;
  --ink:#062F28; --ink-2:#3B5A52; --muted:#7C8C87;
  --line:#E6E9EA; --line-2:#D5DADB;
  --lima:#9FE870; --lima-2:#CFF3B4; --lima-ink:#062F28;
  --r:22px; --r2:16px;
  --brand:#0B4A3C; --brand-soft:#E7F7DA; --brand-lift:#116352; --brand-deep:#062F28;
  --verde:#2F8F43; --verde-bg:#E8F6DF;
  --vermelho:#CE4B40; --vermelho-bg:#FCEBE7;
  --azul:#2B6CD4; --azul-bg:#E7EFFC;
  --ambar:#8A6A12; --ambar-mark:#D3A82A; --ambar-bg:#F9F2DE;
  --shadow:0 1px 2px rgba(6,47,40,.035), 0 8px 24px rgba(6,47,40,.05);
  --on-brand:#FFFFFF;
  --toast-bg:#062F28; --toast-ink:#FFFFFF;
  --fc:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --fh:'Urbanist','Segoe UI',Helvetica,Arial,sans-serif;
  --fd:'Urbanist','Segoe UI',Helvetica,Arial,sans-serif;
  --fb:'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif;
  --fn:'Space Grotesk','Plus Jakarta Sans',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --sidebar:#0C1A16; --sidebar-2:#162B25; --sidebar-ink:#E6F2EC; --sidebar-dim:#84A096; --sidebar-line:#1E3A32;
  --bg:#0A1512; --surface:#0F1F1B; --surface-2:#162B25; --surface-3:#1E3A32;
  --past-a:#14301F; --past-b:#13302A; --past-c:#1D3320; --past-ink:#E6F2EC;
  --ink:#E6F2EC; --ink-2:#A9C4BA; --muted:#84A096;
  --line:#1E3A32; --line-2:#2B4F44;
  --lima:#9FE870; --lima-2:#2A5733; --lima-ink:#062F28;
  --brand:#9FE870; --brand-soft:#15301D; --brand-lift:#B8F08F; --brand-deep:#7CCB4E;
  --verde:#3FC08C; --verde-bg:#0B3828; --vermelho:#F08078; --vermelho-bg:#3B1B19;
  --azul:#4DA6FF; --azul-bg:#0C2B4E; --ambar:#E9BA5C; --ambar-mark:#E9BA5C; --ambar-bg:#37290E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
  --toast-bg:#1E3A32; --toast-ink:#E6F2EC;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sidebar:#0C1A16; --sidebar-2:#162B25; --sidebar-ink:#E6F2EC; --sidebar-dim:#84A096; --sidebar-line:#1E3A32;
  --bg:#0A1512; --surface:#0F1F1B; --surface-2:#162B25; --surface-3:#1E3A32;
  --past-a:#14301F; --past-b:#13302A; --past-c:#1D3320; --past-ink:#E6F2EC;
  --ink:#E6F2EC; --ink-2:#A9C4BA; --muted:#84A096;
  --line:#1E3A32; --line-2:#2B4F44;
  --lima:#9FE870; --lima-2:#2A5733; --lima-ink:#062F28;
  --brand:#9FE870; --brand-soft:#15301D; --brand-lift:#B8F08F; --brand-deep:#7CCB4E;
  --verde:#3FC08C; --verde-bg:#0B3828; --vermelho:#F08078; --vermelho-bg:#3B1B19;
  --azul:#4DA6FF; --azul-bg:#0C2B4E; --ambar:#E9BA5C; --ambar-mark:#E9BA5C; --ambar-bg:#37290E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
  --toast-bg:#1E3A32; --toast-ink:#E6F2EC;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.nm{font-family:var(--fd)}
.nm{font-variant-numeric:tabular-nums;letter-spacing:-.3px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-lift);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{display:flex;min-height:100%}
.side{width:238px;flex:0 0 238px;background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;
  border-right:1px solid var(--sidebar-line);
  position:sticky;top:0;height:100vh;padding:18px 12px calc(14px + env(safe-area-inset-bottom,0px))}
/* Assinatura Traction Finance — construção Contraste, igual a traction-contraste-hub/club:
   TRACTION em Hanken Grotesk 600 caixa alta sobre o descritor em Cormorant Garamond itálico 500. */
.logo{display:block;padding:14px 16px 26px}   /* área de proteção: 1/4 da altura da assinatura */
.logo .cap{display:block;font-family:var(--fh);font-weight:600;font-size:26px;letter-spacing:.02em;
  line-height:1;text-transform:uppercase;color:var(--sidebar-ink);white-space:nowrap}
.logo .dsc{display:block;font-family:var(--fc);font-style:italic;font-weight:500;font-size:37px;
  line-height:1;margin-top:-.21em;color:var(--brand);white-space:nowrap}
.navgrp{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--sidebar-dim);font-weight:800;padding:12px 12px 5px}
.navb{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:12px;color:var(--sidebar-ink);
  font-weight:600;font-size:14px;text-align:left;opacity:.72;transition:background .16s,opacity .16s}
.navb:hover{background:var(--sidebar-2);opacity:1}
.navb[aria-current="page"]{background:var(--sidebar-2);opacity:1;font-weight:700}
.navb[aria-current="page"] svg{stroke-width:2.1}
.navb svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sidefoot{margin-top:auto;border-top:1px solid var(--sidebar-line);padding-top:12px}
.pfbar{display:flex;align-items:center;gap:8px}
.ctrl .pfbar{flex:0 0 auto}
.pfbar .perfilW{flex:1 1 auto;min-width:0}
/* no rodapé da lateral o botão vira a própria linha do perfil */
.sidefoot .perfilB{width:100%;background:transparent;border:0;border-radius:11px;padding:7px 8px;height:auto;gap:10px;color:var(--sidebar-ink)}
.sidefoot .perfilB:hover{background:var(--sidebar-2)}
.sidefoot .perfilB .av2{width:34px;height:34px;font-size:12px}
.sidefoot .perfilB .nn2{flex:1 1 auto;min-width:0;max-width:none;text-align:left;font-weight:400}
.sidefoot .perfilB .nn2 b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidefoot .perfilB .nn2 small{display:block;font-size:11.5px;font-weight:600;color:var(--sidebar-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidefoot .perfilB .cv{color:var(--sidebar-dim);font-size:10px;flex:0 0 auto}
.sidefoot .corB{width:36px;height:36px;border-radius:10px;background:transparent;border:1px solid var(--sidebar-line);color:var(--sidebar-ink);flex:0 0 auto}
.sidefoot .corB:hover{background:var(--sidebar-2)}
.sidefoot .corB i{box-shadow:inset 0 0 0 1px rgba(6,47,40,.14)}
/* no rodapé, os menus abrem para cima */
.sidefoot .perfilM,.sidefoot .corM{top:auto;bottom:calc(100% + 10px);left:0;right:auto;width:248px;min-width:0}
.who{display:flex;align-items:center;gap:10px;padding:6px 10px}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--sidebar-2);display:grid;place-items:center;
  font-family:var(--fd);font-weight:700;font-size:12.5px;color:var(--sidebar-ink);flex:0 0 auto}
.who b{font-size:13.5px;font-weight:700;display:block;line-height:1.25}
.who span{font-size:11.5px;color:var(--sidebar-dim)}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:18;background:var(--bg);
  padding:16px 22px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.hello{flex:1 1 180px;min-width:0}
.hello b{font-family:var(--fd);font-size:19px;font-weight:600;display:block;line-height:1.2}
.hello span{font-size:12.5px;color:var(--muted)}
.ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctrl .arw{width:32px;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--brand);
  font-size:17px;display:grid;place-items:center;flex:0 0 auto}
.ctrl .arw:hover{background:var(--brand-soft)}
.ctrl .arw[disabled]{opacity:.35;cursor:default}
.ctrl select{font-family:var(--fd);font-weight:600;font-size:13.5px;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:8px 9px;min-width:0}
.ctrl #selMes{flex:0 1 128px} .ctrl #selAno{flex:0 0 80px}
.ctrl .hoje{font-size:12.5px;font-weight:700;color:var(--brand);padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.ctrl .hoje[disabled]{opacity:.4;cursor:default}
.perfilW{position:relative;flex:0 0 auto}
.perfilB{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 3px;height:36px}
.perfilB:hover{background:var(--brand-soft)}
.perfilB .av2{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--fd);font-weight:700;font-size:11px;flex:0 0 auto}
.perfilB .nn2{font-size:12.5px;font-weight:700;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.perfilB .nn2 small{display:none}
.perfilB .cv{font-size:10px;color:var(--muted)}
.perfilM{position:absolute;right:0;top:44px;z-index:40;background:var(--surface);border:1px solid var(--line-2);border-radius:13px;
  box-shadow:0 10px 32px rgba(10,42,94,.18);padding:7px;min-width:236px}
.perfilM[hidden]{display:none}

.perfilM .pi{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:9px;text-align:left;font-size:13.5px;font-weight:600}
.perfilM .pi:hover{background:var(--surface-2)}
.perfilM .pi[aria-current="true"]{background:var(--brand-soft);color:var(--brand)}
.perfilM .pi .av2{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--fd);font-weight:700;font-size:10.5px;flex:0 0 auto}
.perfilM .pi .gro{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.perfilM hr{border:0;border-top:1px solid var(--line);margin:6px 2px}
.perfilM .np{display:flex;gap:6px;padding:4px 3px}
.perfilM .np input{flex:1 1 auto;min-width:0;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font-size:13px}
.seg3{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:0 0 auto}
.seg3 button{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink-2)}
.seg3 button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.content{padding:18px 22px 40px;flex:1 1 auto}

.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr);align-items:start}
.grid+.grid{margin-top:14px}
.grid.eq{align-items:stretch}
.grid.eq > .card{display:flex;flex-direction:column}
.grid.eq > .card > .wrapcard{flex:1 1 auto;display:flex;flex-direction:column}
.c3{grid-column:span 3} .c4{grid-column:span 4} .c5{grid-column:span 5}
.c6{grid-column:span 6} .c7{grid-column:span 7} .c8{grid-column:span 8} .c12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-width:0}
.card > h2{margin:0 0 3px;font-size:10.5px;font-weight:800;letter-spacing:1.9px;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card > h2 em{font-style:normal;color:var(--brand);font-weight:700;letter-spacing:.4px;text-transform:none;font-size:12px;white-space:nowrap}
.card .sub{margin:0 0 13px;font-size:12.5px;color:var(--muted)}

.saldo{background:linear-gradient(150deg,var(--sidebar-2),var(--sidebar));color:var(--sidebar-ink);border:0}
.saldo h2{color:var(--sidebar-dim)}
.saldo .big{font-family:var(--fd);font-size:31px;font-weight:600;letter-spacing:-1px;line-height:1.15;margin:4px 0 2px;
  font-variant-numeric:tabular-nums;color:#fff}
.saldo .cap{font-size:12.5px;color:var(--sidebar-dim)}
.saldo .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.saldo .acts button{flex:1 1 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.17);color:#fff;
  border-radius:10px;padding:9px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.saldo .acts button:hover{background:rgba(255,255,255,.19)}

.bars{display:flex;flex-direction:column;gap:13px}
.bar .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px}
.bar .lb{font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}
.bar .lb i{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.bar .vl{font-family:var(--fd);font-weight:600;font-size:15.5px;font-variant-numeric:tabular-nums}
.trk{height:15px;border-radius:6px;background:var(--surface-3);overflow:hidden;display:flex}
.sg{height:100%} .sg.pv{opacity:.33}
.bar .ft{margin-top:4px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.bar .ft b{color:var(--ink-2);font-variant-numeric:tabular-nums}

.minis3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{position:relative;border-radius:16px;padding:14px 15px;border:0;min-width:0}
.mini .bd{position:absolute;right:11px;top:11px;width:25px;height:25px;border-radius:50%;
  display:grid;place-items:center;font-size:11px;font-weight:700;
  background:var(--surface);color:var(--ink-2);box-shadow:0 1px 3px rgba(10,20,40,.12)}
.mini .k{font-size:12px;font-weight:700;letter-spacing:0;display:flex;align-items:center;gap:5px}
.mini .v{display:block;font-family:var(--fd);font-size:19px;font-weight:600;letter-spacing:-.6px;margin-top:7px;
  font-variant-numeric:tabular-nums;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .h{display:block;font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini.e{background:var(--verde-bg)} .mini.e .k{color:var(--verde)}
.mini.s{background:var(--vermelho-bg)} .mini.s .k{color:var(--vermelho)}
.mini.o{background:var(--ambar-bg)} .mini.o .k{color:var(--ambar)}
@media (max-width:860px){
  .minis3{grid-template-columns:repeat(3,1fr);gap:7px}
  .mini{padding:10px 8px;display:block}
  .mini .k{font-size:10px;gap:3px;letter-spacing:0}
  .mini .v{font-size:15px;letter-spacing:-.6px;margin-top:5px}
  .mini .h{font-size:10px;white-space:normal;overflow:visible;line-height:1.3}
}
.vsbar{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--surface-3);margin:9px 0 3px}
.vsbar i{height:100%}
.pat{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.pat:last-of-type{border-bottom:0}
.pat b{font-family:var(--fd);font-weight:600;font-variant-numeric:tabular-nums}
.ccl{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ccl:last-of-type{border-bottom:0}
.ccl:hover{background:var(--surface-2);border-radius:8px}
.ccl .dot{width:26px;height:18px;border-radius:4px;flex:0 0 auto}
.ccl .nn{flex:1 1 auto;min-width:0;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccl .vv2{font-family:var(--fd);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.nota{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.nota .pt{font-family:var(--fd);font-size:38px;font-weight:600;line-height:1;letter-spacing:-1.5px}
.nota .pt small{font-size:15px;color:var(--muted);font-weight:500}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.tag.ok{background:var(--verde-bg);color:var(--verde)} .tag.at{background:var(--ambar-bg);color:var(--ambar)}
.tag.rk{background:var(--vermelho-bg);color:var(--vermelho)} .tag.b{background:var(--brand-soft);color:var(--brand)}
.nline{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
.nline .nb{flex:1 1 auto;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:40px}
.nline .nb i{display:block;height:100%;border-radius:3px}
.nline .nl{width:92px;flex:0 0 auto;color:var(--ink-2);font-weight:600}
.nline .nv{width:46px;flex:0 0 auto;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}

.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.chk{width:21px;height:21px;border-radius:7px;border:2px solid var(--line-2);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.chk[data-on="1"]{background:var(--verde);border-color:var(--verde)}
.chk.sm{width:19px;height:19px;border-radius:6px;font-size:10px}
.chk.q[data-on="1"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chk[disabled]{opacity:.3;cursor:default}
.ico{width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:14px;font-weight:700}
.ico.e{background:var(--verde-bg);color:var(--verde)} .ico.s{background:var(--vermelho-bg);color:var(--vermelho)}
.ico.r{background:var(--azul-bg);color:var(--azul)}
.row .tx{flex:1 1 auto;min-width:0}
.row .tx .n{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx .m{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .am{font-family:var(--fd);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .am.e{color:var(--verde)} .row .am.s{color:var(--vermelho)} .row .am.r{color:var(--azul)}
.row .x{color:var(--muted);font-size:16px;width:24px;height:24px;border-radius:7px;flex:0 0 auto}
.row .x:hover{background:var(--vermelho-bg);color:var(--vermelho)}
.row.quit .tx .n{text-decoration:line-through;opacity:.55}
.pill{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border-radius:999px}
.pill.e{background:var(--verde-bg);color:var(--verde)} .pill.s{background:var(--vermelho-bg);color:var(--vermelho)}

}

/* carteira — retângulos no formato de cartão */

.grpbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:13px}

.verT{font-size:12.5px;font-weight:800;color:var(--brand);border:1px solid var(--line-2);border-radius:9px;padding:8px 13px;background:var(--surface);flex:0 0 auto}

.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

.ccb{padding:4px 14px 12px}

.corW{position:relative;flex:0 0 auto}

/* ===== trilho do score ===== */

/* ===== card de insight ===== */
.insc{padding:0 !important;overflow:hidden;background:var(--past-a);border-color:transparent;box-shadow:none}
.insc .ic{background:rgba(255,255,255,.72)}

  font-size:16px;line-height:1;flex:0 0 auto}

.insc .inner{padding:16px}

/* insight do mês */
.ins{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}

.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;display:flex}

.mta .ln{display:flex;gap:9px;align-items:flex-start;margin-top:10px;font-size:12.5px;color:var(--ink-2);line-height:1.5}

.mini-meta{background:var(--surface-2);border-radius:11px;padding:11px 12px}

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.dej{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px;background:var(--surface)}

.dej .mt .v{display:block;margin-top:3px;font-family:var(--fd);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink)}

.lgh{display:flex;gap:16px;flex-wrap:wrap}
.mini-in{font-family:var(--fd);font-weight:600;font-size:12.5px;text-align:center;padding:5px 6px;border-radius:8px;

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}

}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 12px}

.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:12.5px}

.tbl th{text-align:right;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:7px 9px;border-bottom:1px solid var(--line-2);font-weight:800}

.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--toast-bg);
  color:var(--toast-ink);border-radius:10px;padding:9px 11px 9px 16px;font-size:13px;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.28);
  opacity:0;transform:translateY(8px);transition:opacity .16s,transform .16s;pointer-events:none;
  display:flex;align-items:center;gap:12px;justify-content:center}

.botnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sidebar);

/* ===== folhas deslizantes (mobile) ===== */

/* ======================= Movimento =======================
   Tudo aqui vive dentro de prefers-reduced-motion: quem pede menos movimento
   no sistema recebe a mesma tela, parada. */
@keyframes sobe{ from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
@keyframes surge{ from{opacity:0;transform:scale(.97)} to{opacity:1;transform:none} }
@keyframes fatia{ from{opacity:0} to{opacity:1} }
@keyframes deriva{ from{transform:translate3d(0,0,0) rotate(0deg) scale(1)}
                   to{transform:translate3d(-4%,3%,0) rotate(-5deg) scale(1.08)} }
@keyframes folhaSobe{ from{opacity:0;transform:translateY(26px) scale(.985)} to{opacity:1;transform:none} }
@keyframes campoEntra{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

@media (prefers-reduced-motion:no-preference){
  .entra > .grid > .card, .entra > .card, .entra > .grid > .note{
    animation:sobe .44s cubic-bezier(.22,.9,.3,1) backwards }
  .entra > .grid > .card:nth-child(1){animation-delay:0ms}
  .entra > .grid > .card:nth-child(2){animation-delay:45ms}
  .entra > .grid > .card:nth-child(3){animation-delay:90ms}
  .entra > .grid > .card:nth-child(4){animation-delay:130ms}
  .entra > .grid > .card:nth-child(5){animation-delay:165ms}
  .entra > .grid > .card:nth-child(6){animation-delay:195ms}
  .entra > .grid > .card:nth-child(7){animation-delay:220ms}
  .entra > .grid > .card:nth-child(n+8){animation-delay:240ms}
  .entra .ch path{animation:fatia .5s ease backwards}
  .entra .ch path:nth-child(2){animation-delay:60ms}
  .entra .ch path:nth-child(3){animation-delay:110ms}
  .entra .ch path:nth-child(4){animation-delay:155ms}
  .entra .ch path:nth-child(5){animation-delay:195ms}
  .entra .ch path:nth-child(n+6){animation-delay:230ms}
  .saldoC .swl{animation:deriva 24s ease-in-out infinite alternate}
  .cadw .cadc{animation:folhaSobe .4s cubic-bezier(.22,.9,.3,1) backwards}
  .cadw .cadl,.cadw .cadb,.cadw .cadn,.cadw .cadt{animation:campoEntra .42s ease backwards}
  .cadw .cadl:nth-of-type(1){animation-delay:70ms}
  .cadw .cadl:nth-of-type(2){animation-delay:110ms}
  .cadw .cadl:nth-of-type(3){animation-delay:145ms}
  .cadw .cadl:nth-of-type(4){animation-delay:175ms}
  .cadw .cadl:nth-of-type(5){animation-delay:200ms}
  .cadw .cadb{animation-delay:230ms}
  .cadw .cadn{animation-delay:265ms}
  .sheet{animation:folhaSobe .3s cubic-bezier(.22,.9,.3,1)}
  .toast.on{animation:surge .22s cubic-bezier(.34,1.4,.64,1)}
}
/* as barras nascem em zero e crescem até o valor */
[data-cresce]{transition:width .72s cubic-bezier(.22,.9,.3,1)}
@media (prefers-reduced-motion:reduce){ [data-cresce]{transition:none} }
.navb,.card,.pz,.qa button i,.vdt,.bkl button{will-change:auto}

/* ===== Cartão de saldo (lima) ===== */
.saldoC{position:relative;overflow:hidden;background:var(--lima);border-color:transparent;
  color:var(--lima-ink);display:flex;flex-direction:column;min-height:218px;
  box-shadow:0 1px 2px rgba(6,47,40,.05), 0 10px 30px rgba(6,47,40,.10)}
.saldoC::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 100% at 88% 6%, rgba(255,255,255,.55), transparent 58%),
             radial-gradient(95% 80% at 6% 100%, rgba(6,47,40,.10), transparent 62%)}
.saldoC .swl{position:absolute;right:-6%;top:-28%;width:70%;height:150%;pointer-events:none;opacity:.9}
.saldoC > *{position:relative;z-index:1}
.saldoC .lbl{display:block;font-family:var(--fh);font-size:12px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--lima-ink);opacity:.72}
.saldoC .num{font-family:var(--fn);font-weight:600;letter-spacing:-2px;line-height:1;
  font-size:clamp(34px,4.4vw,46px);margin:10px 0 0;color:var(--lima-ink);font-variant-numeric:tabular-nums}
.saldoC .num s{text-decoration:none;font-size:.52em;letter-spacing:-.6px;opacity:.6}
.saldoC .sub2{display:block;font-size:13px;font-weight:600;color:var(--lima-ink);opacity:.74;margin-top:7px}
.saldoC .eyeTop{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:50%;
  border:0;background:rgba(255,255,255,.62);color:var(--lima-ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;z-index:2;transition:background .15s,transform .15s}
.saldoC .eyeTop:hover{background:#fff;transform:scale(1.06)}
.pills{display:flex;gap:9px;margin-top:auto;padding-top:20px;flex-wrap:wrap}
.pz{display:inline-flex;align-items:center;gap:7px;height:43px;padding:0 20px;border-radius:999px;
  font:inherit;font-family:var(--fb);font-size:14px;font-weight:700;cursor:pointer;border:0;
  transition:transform .15s cubic-bezier(.34,1.3,.64,1),box-shadow .15s,filter .15s}
.pz i{font-style:normal;font-size:13px}
.pz:hover{transform:translateY(-2px)}

.pz.br{background:#fff;color:var(--lima-ink);box-shadow:0 2px 8px rgba(6,47,40,.12)}

.heroB .linhas{border-top:1px solid var(--line);padding-top:13px;margin:0}
@media (max-width:860px){

  .saldoC .num{font-size:38px}

/* O que você gasta no mês e não lança (lanche, combustível, farmácia). O sistema só
   estima a PARTE QUE FALTA: se você já lançou R$200 de um costume de R$700, restam R$500. */
function lancSaidas(k){
  var t=0; lancs.forEach(function(l){ if((l.data||'').slice(0,7)===k&&l.tipo==='saida') t+=+l.valor||0 });
  return r2(t);
}

/* ======================================================================
   VERBA DIÁRIA
   A sobra do mês vira um limite de gasto por dia: uma parte dela (80% por
   padrão) repartida pelos dias, e o resto fica de pé para o mês seguinte.
   O que sai num dia muda o limite dos dias que faltam, e qualquer dia pode
   ter um limite próprio.

   Ligação com o resto do sistema: quando está ligada, a verba ASSUME o papel
   do "dia a dia" — diaDiaBase() passa a devolvê-la. Com isso o que passa
   para o mês seguinte continua sendo calculado pela mesma regra de sempre,
   e acaba sendo exatamente a parte que você reservou de pé.
   ====================================================================== */
function vdOn(){ return cfg.vdAuto===true }
function vdPct(k){
  var v=(meses[k]||{}).vd||{};
  var p=(v.pct!=null?+v.pct:(cfg.vdPct!=null?+cfg.vdPct:80));
  return Math.max(0,Math.min(100,isFinite(p)?p:80));
}
function vdDias(k){ var v=(meses[k]||{}).vd||{}; return v.dias||{} }
/* o bolo antes de qualquer gasto do dia a dia */
function vdBase(k){ return r2(calc(k).disponivel + lancSaidas(k)) }
function vdVerba(k){ return r2(Math.max(0, vdBase(k)*vdPct(k)/100)) }
function gastoDoDia(k,d){
  var iso=k+'-'+String(d).padStart(2,'0'), t=0;
  lancs.forEach(function(l){ if(l.data===iso&&l.tipo==='saida') t+=+l.valor||0 });
  return r2(t);
}
function vdPlano(k){
  var nd=dim(k), verba=vdVerba(k), base=vdBase(k), fix=vdDias(k), d;
  /* dias já vividos entram pelo que de fato saiu; os que faltam dividem o resto */
  var hojeD = (k===MES_HOJE ? hoje.getDate() : (k<MES_HOJE ? nd+1 : 0));
  var passado=0, presos=0, livres=0;
  for(d=1;d<=nd;d++){
    if(d<hojeD){ passado+=gastoDoDia(k,d); continue }
    if(fix[d]!=null) presos+=(+fix[d]||0); else livres++;
  }
  var resta=r2(verba-passado-presos);
  var porDia=livres>0?r2(Math.max(0,resta)/livres):0;
  /* o quanto ainda cabe conta TAMBEM o que saiu hoje, para o numero do mes
     reagir na hora; a divisao pelos dias so muda quando o dia vira. */
  var restaReal=r2(verba-lancSaidas(k)-presos);
  var lim={}, falta={};
  for(d=1;d<=nd;d++){
    var g=gastoDoDia(k,d);
    lim[d]=r2(d<hojeD ? g : (fix[d]!=null ? (+fix[d]||0) : porDia));
    falta[d]=r2(lim[d]-g);
  }
  return { nd:nd, base:base, verba:verba, cofre:r2(base-verba), pct:vdPct(k),
    hojeD:hojeD, porDia:porDia, livres:livres, presos:r2(presos),
    passado:r2(passado), resta:restaReal, estourou:restaReal<-0.004,
    gasto:lancSaidas(k), lim:lim, falta:falta, fix:fix };
}
function salvaVd(k,mut,msg){
  mesDoc(k);
  if(!meses[k].vd) meses[k].vd={};
  mut(meses[k].vd);
  saveMes(k,msg);
}
function diaDiaBase(k){
  if(vdOn()) return vdVerba(k);
  var d=meses[k]||{}; return (d.diaDia!=null&&d.diaDia!=='')?+d.diaDia:(+cfg.diaDia||0);
}
function diaDiaDe(k){ return r2(Math.max(0, diaDiaBase(k)-lancSaidas(k))) }
/* o que de fato passa de um mês para o seguinte */
function fecha(k){ return r2(calc(k).disponivel - diaDiaDe(k)) }

/* O saldo de abertura não pode ficar congelado: se o mês anterior muda, este muda junto.
   Recalculado só em memória — o valor gravado serve de reserva para meses soltos. */
function recalcSaldos(){
  var ks=Object.keys(meses).sort();
  for(var i=0;i<ks.length;i++){
    var k=ks[i], ant=shift(k,-1);
    if(meses[k].siManual) continue;
    if(meses[ant]) meses[k].saldoInicial=fecha(ant);
  }
}

function mesDoc(k){
  if(!meses[k]){
    var a=meses[shift(k,-1)];
    meses[k]={saldoInicial:a?fecha(shift(k,-1)):0,
      itens:a?(a.itens||[]).map(function(i){var o={id:uid(),nome:i.nome,tipo:i.tipo,valor:i.valor};
        if(i.auto5du)o.auto5du=true; if(i.dia)o.dia=i.dia; return o}):[],
      pagos:{},faturas:{}};
  }
  if(!meses[k].itens)meses[k].itens=[];
  if(!meses[k].pagos)meses[k].pagos={};
  if(!meses[k].faturas)meses[k].faturas={};
  return meses[k];
}
function rotulo(i,k){ return i.auto5du ? i.nome+' — '+MN[+k.split('-')[1]-1]+', 5º dia útil ('+diaUtil(k,5)+')' : i.nome }
function realDe(i,pg){ if(i.real!=null&&i.real!=='')return +i.real; if(pg&&pg[i.id])return +i.valor||0; return null }

function ativa(d,k){ if(d.quitado)return false; var p=diff(d.inicio,k); return p>=0&&p<(+d.total||0) }
function listaCartoes(){
  var mp={},out=[];
  cartoes.forEach(function(c){ if(c&&c.nome) mp[c.nome]={id:c.id||slug(c.nome),nome:c.nome,recorrentes:c.recorrentes||[],cor:c.cor,venc:c.venc,arquivado:c.arquivado,principal:c.principal} });
  dividas.forEach(function(d){ var n=(d.cartao||'Outros'); if(!mp[n]) mp[n]={id:slug(n),nome:n,recorrentes:[]} });
  Object.keys(mp).forEach(function(n){ out.push(mp[n]) });
  return out;
}
function fatura(c,k){
  var par=0, lista=[];
  dividas.forEach(function(d){ if((d.cartao||'Outros')!==c.nome||!ativa(d,k))return;
    par+=+d.valor||0; lista.push(d); });
  var rec=(c.recorrentes||[]).reduce(function(a,r){return a+(+r.valor||0)},0);
  var base=r2(par+rec);
  var ov=(meses[k]&&meses[k].faturas&&meses[k].faturas[c.id])||{};
  return {c:c,parcelas:r2(par),recorrentes:r2(rec),base:base,
    plan:(ov.plan!=null?+ov.plan:base), real:(ov.real!=null?+ov.real:null),
    ajustado:(ov.plan!=null&&r2(ov.plan)!==base), lista:lista};
}
/* só entram no plano os cartões com movimento no mês — os pagos somem sozinhos */
function faturasDoMes(k){
  return listaCartoes().filter(function(c){return !c.arquivado}).map(function(c){return fatura(c,k)})
    .filter(function(f){return f.base!==0||f.plan!==0||f.real!=null})
    .sort(function(a,b){return b.plan-a.plan});
}

function calc(k){
  var d=meses[k]||{saldoInicial:0,itens:[],pagos:{},faturas:{}}, it=d.itens||[], pg=d.pagos||{};
  var o={entT:0,entR:0,saiT:0,saiR:0,resT:0,resR:0,entP:0,saiP:0,resP:0};
  it.forEach(function(i){
    var t=i.tipo==='entrada'?'ent':i.tipo==='reserva'?'res':'sai';
    var pl=+i.valor||0, r=realDe(i,pg);
    o[t+'P']+=pl; o[t+'T']+=(r!=null?r:pl); if(r!=null)o[t+'R']+=r;
  });
  faturasDoMes(k).forEach(function(f){
    o.saiP+=f.plan; o.saiT+=(f.real!=null?f.real:f.plan); if(f.real!=null)o.saiR+=f.real;
  });
  lancs.forEach(function(l){ if((l.data||'').slice(0,7)!==k)return;
    var t=l.tipo==='entrada'?'ent':l.tipo==='reserva'?'res':'sai';
    o[t+'T']+=+l.valor||0; o[t+'R']+=+l.valor||0; o[t+'P']+=+l.valor||0; });
  var si=+d.saldoInicial||0;
  o.saldoInicial=si; o.saldoHoje=si+o.entR-o.saiR-o.resR; o.disponivel=r2(si+o.entT-o.saiT-o.resT);
  return o;
}
function diasRest(k){ return k===MES_HOJE?Math.max(1,dim(k)-hoje.getDate()+1):dim(k) }
function parcelasEm(k){
  var t=0,pago=0,l=[];
  dividas.forEach(function(d){ if(!ativa(d,k))return;
    var v=+d.valor||0, paga=!!(d.pagas&&d.pagas[k]);
    t+=v; if(paga)pago+=v;
    l.push({id:d.id,nome:d.nome,cartao:d.cartao,valor:v,resta:(+d.total)-diff(d.inicio,k),paga:paga}); });
  return {total:r2(t),pago:r2(pago),itens:l};
}
function saldoDivida(k){
  var t=0;
  dividas.forEach(function(d){ if(d.quitado)return;
    var p=Math.max(0,diff(d.inicio,k)), r=(+d.total||0)-p;
    if(r>0)t+=r*(+d.valor||0);
    if(d.pagas&&d.pagas[k])t-=(+d.valor||0); });
  return r2(t);
}
function categorias(k){
  var mp={}, d=meses[k]||{itens:[],pagos:{}};
  function add(n,v){ if(v>0)mp[n]=(mp[n]||0)+v }
  (d.itens||[]).forEach(function(i){ if(i.tipo!=='saida')return;
    var r=realDe(i,d.pagos||{}); add(i.nome,r!=null?r:(+i.valor||0)); });
  faturasDoMes(k).forEach(function(f){
    if(f.real!=null){ add('Fatura '+f.c.nome,f.real); return; }
    if(f.ajustado){ add('Fatura '+f.c.nome,f.plan); return; }
    if(f.parcelas>0) add('Parcelas '+f.c.nome,f.parcelas);
    (f.c.recorrentes||[]).forEach(function(r){ add(r.nome,+r.valor||0) });
  });
  lancs.forEach(function(l){ if((l.data||'').slice(0,7)===k&&l.tipo==='saida') add(l.cat||l.desc||'Outros',+l.valor||0) });
  return Object.keys(mp).map(function(n){return{nome:n,valor:mp[n]}}).sort(function(a,b){return b.valor-a.valor});
}
/* patrimônio = saldo inicial da reserva + tudo que foi destinado a ela até o mês */
function reservaAcum(k){ var nt=nota(k); return r2(nt.patr-nt.inv) }
function ritmoReserva(k){
  var ks=Object.keys(meses).filter(function(j){return j<=k}).sort(), t=0;
  if(!ks.length)return 0;
  ks.forEach(function(j){ t+=calc(j).resT });
  return r2(t/ks.length);
}
function temDe(mt,k){
  return mt.fonte==='reserva'?reservaAcum(k)
    : mt.fonte==='investimentos'?totalInv()
    : mt.fonte==='patrimonio'?nota(k).patr : (+mt.jaTem||0);
}
function planoMeta(mt,k){
  var alvo=+mt.alvo||0, tem=temDe(mt,k);
  var falta=r2(Math.max(0,alvo-tem)), pct=alvo>0?Math.min(100,tem/alvo*100):0;
  var sobra=calc(k).disponivel, ritmo=ritmoReserva(k);
  var mesesPrazo=mt.prazo?(diff(k,mt.prazo)+1):0;
  var porMes=mesesPrazo>0?r2(falta/mesesPrazo):0;
  var noRitmo=(falta<=0)?0:(ritmo>0?Math.ceil(falta/ritmo):0);
  var chegaRitmo=(falta<=0)?k:(noRitmo>0?shift(k,noRitmo-1):null);
  var pesoSobra=sobra>0?porMes/sobra*100:0;
  var nivel = falta<=0 ? 'ok'
    : (mesesPrazo>0 && (mesesPrazo<0 || porMes>sobra)) ? 'rk'
    : (mesesPrazo>0 && pesoSobra>60) ? 'at'
    : (mesesPrazo<=0 && !chegaRitmo) ? 'at' : 'ok';
  return {alvo:alvo,tem:tem,falta:falta,pct:pct,sobra:sobra,ritmo:ritmo,mesesPrazo:mesesPrazo,
    porMes:porMes,noRitmo:noRitmo,chegaRitmo:chegaRitmo,pesoSobra:pesoSobra,nivel:nivel,
    atrasada:(mt.prazo&&mesesPrazo<=0&&falta>0)};
}
function totalInv(){ return r2(investimentos.reduce(function(a,i){return a+(+i.atual||0)},0)) }
function aportadoInv(){ return r2(investimentos.reduce(function(a,i){return a+(+i.aportado||0)},0)) }
function patrimonio(k){
  var t=+cfg.reservaAtual||0;
  Object.keys(meses).sort().forEach(function(j){ if(j<=k) t+=calc(j).resT });
  return r2(t+totalInv());
}
function nota(k){
  var c=calc(k);
  var inv=totalInv(), patr=patrimonio(k), aporte=c.resT, base=+cfg.reservaAtual||0;
  var ante=r2(patr-aporte-inv), passivo=saldoDivida(k);
  var cob=passivo>0?(patr/passivo):(patr>0?1.5:1);
  var total=Math.max(0,Math.min(100,Math.round(cob*100)));
  var razao=patr>0?(passivo/patr):(passivo>0?99:0);
  return {total:total,patr:patr,base:base,ante:ante,aporte:aporte,inv:inv,passivo:passivo,cob:cob,razao:razao};
}
function periodo(){
  var a,b,i,out=[];
  if(FLT.modo==='mes'){ a=MES;b=MES }
  else if(FLT.modo==='ano'){ a=MES.split('-')[0]+'-01'; b=MES.split('-')[0]+'-12' }
  else if(FLT.modo==='custom'&&FLT.de&&FLT.ate){ a=FLT.de;b=FLT.ate; if(diff(a,b)<0){var t=a;a=b;b=t} }
  else { a=shift(MES,-11); b=MES }
  if(a<MES_MIN)a=MES_MIN;
  for(i=0;i<=Math.min(60,Math.max(0,diff(a,b)));i++){ var k=shift(a,i); if(meses[k])out.push({k:k,c:calc(k)}) }
  return out;
}
function rotuloPeriodo(){
  if(FLT.modo==='mes')return lbl(MES);
  if(FLT.modo==='ano')return 'ano de '+MES.split('-')[0];
  if(FLT.modo==='custom'&&FLT.de&&FLT.ate)return lblS(FLT.de)+' a '+lblS(FLT.ate);
  return 'até 12 meses atrás';
}
function anos(){ var s={},i;
  Object.keys(meses).forEach(function(k){s[k.split('-')[0]]=1});
  dividas.forEach(function(d){var f=shift(d.inicio,(+d.total||1)-1);
    for(i=+d.inicio.split('-')[0];i<=+f.split('-')[0];i++)s[i]=1});
  s[MES.split('-')[0]]=1;
  var yMin=+MES_MIN.split('-')[0];
  var a=Object.keys(s).map(Number).filter(function(y){return y>=yMin}).sort(function(x,y){return x-y});
  var out=[]; for(i=yMin;i<=Math.max(a[a.length-1],yMin)+1;i++)out.push(i); return out;
}


/* ======================= Motor de movimento =======================
   O painel redesenha por inteiro a cada mudan\u00e7a de dado, ent\u00e3o animar sempre
   deixaria a tela tremendo. A entrada s\u00f3 roda quando a tela realmente muda:
   primeira pintura, troca de aba, de m\u00eas ou de perfil. */
function semMov(){
  try{ return window.matchMedia('(prefers-reduced-motion:reduce)').matches }catch(e){ return false }
}
var TELA_ANT='', T_ENTRA=0, NUMS={}, JANELA=700;
function naEntrada(){ return (Date.now()-T_ENTRA)<JANELA }
function marcaEntrada(){
  var chave=ABA+'|'+MES+'|'+PERFIL;
  if(chave===TELA_ANT){
    /* Mesma tela. O painel redesenha v\u00e1rias vezes nos primeiros instantes, \u00e0 medida
       que os dados chegam do banco: durante a janela da entrada a classe fica, para
       a anima\u00e7\u00e3o n\u00e3o ser cortada pela metade. Passada a janela ela sai, sen\u00e3o cada
       grava\u00e7\u00e3o faria a tela inteira piscar de novo. */
    if(!naEntrada()) view.classList.remove('entra');
    return naEntrada();
  }
  TELA_ANT=chave; T_ENTRA=Date.now();
  view.classList.remove('entra');
  if(semMov()) return true;
  void view.offsetWidth;            /* reinicia a anima\u00e7\u00e3o */
  view.classList.add('entra');
  return true;
}
/* conta de um valor ao outro; a cada quadro o texto \u00e9 remontado pela mesma
   fun\u00e7\u00e3o que o desenhou, para os centavos menores continuarem certos */
function conta(el,chave,alvo,montar){
  var de=(NUMS[chave]==null?0:NUMS[chave]);
  NUMS[chave]=alvo;
  if(semMov()||OCULTO||Math.abs(alvo-de)<0.005){ el.innerHTML=montar(alvo); return }
  var t0=0, dur=Math.abs(alvo-de)>1?680:260;
  function passo(t){
    if(!t0)t0=t;
    var k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    if(NUMS[chave]!==alvo) return;   /* outro valor chegou no meio: deixa pra ele */
    el.innerHTML=montar(de+(alvo-de)*e);
    if(k<1) requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);
}
/* barras marcadas com data-cresce partem de zero no primeiro quadro */
function cresce(){
  if(semMov())return;
  var el=view.querySelectorAll('[data-cresce]');
  if(!el.length)return;
  var larg=[],i;
  for(i=0;i<el.length;i++){ larg.push(el[i].getAttribute('data-cresce')); el[i].style.width='0%' }
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    for(var j=0;j<el.length;j++) el[j].style.width=larg[j];
  })});
}

function render(){
  recalcSaldos();
  var mm=+MES.split('-')[1], aa=+MES.split('-')[0], yMin=+MES_MIN.split('-')[0], mMin=+MES_MIN.split('-')[1];

/* ===== Insight do mês: lê o mês inteiro e diz as 3 coisas que mais importam ===== */
/* o card mostra a primeira frase como título e o resto como corpo */
function parteFrase(t){
  var i=String(t).indexOf('. ');
  if(i<0||i>160) return [t,''];
  return [t.slice(0,i+1), t.slice(i+2)];
}
function insights(k){
  var out=[], c=calc(k), cats=categorias(k), pc=parcelasEm(k);
  var nd=dim(k), decor=(k===MES_HOJE?hoje.getDate():nd);
  function add(nv,t,ac){ out.push({nv:nv,t:t,ac:ac}) }

  if(c.disponivel<0)
    add('rk','O mês fecha <b>'+m(Math.abs(c.disponivel))+' no vermelho</b>. Alguma saída precisa cair ou alguma entrada precisa entrar.',{ab:'lanc',t:'Rever os lançamentos'});

  if(k===MES_HOJE&&c.saiT>0){
    var pg=c.saiR/c.saiT*100, pd=decor/nd*100;
    if(pg-pd>15) add('at','Você já pagou <b>'+n1(pg)+'%</b> das saídas do mês com <b>'+n1(pd)+'%</b> dos dias corridos. O grosso do mês já saiu — o que resta tende a ser folga.',{ab:'cal',t:'Ver o calendário'});
    else if(pd-pg>25) add('at','Faltam <b>'+n1(100-pd)+'%</b> dos dias e ainda <b>'+n1(100-pg)+'%</b> das saídas. A parte pesada do mês ainda está por vir.',{ab:'cal',t:'Ver o calendário'});
  }

  if(c.entT>0){
    var pp=pc.total/c.entT*100;
    if(pp>30) add('rk','As parcelas comem <b>'+n1(pp)+'%</b> da renda ('+m(pc.total)+'/mês). Acima de 30% é onde o orçamento trava.',{ab:'div',t:'Ver as dívidas'});
    else if(pp>20) add('at','As parcelas estão em <b>'+n1(pp)+'%</b> da renda ('+m(pc.total)+'/mês). Dá para assumir pouca coisa nova sem passar de 30%.',{ab:'div',t:'Ver as dívidas'});
  }

  if(c.resT<=0&&c.disponivel>0)
    add('at','Nada foi para a reserva este mês. Separando <b>'+m(c.disponivel*0.1)+'</b> — 10% da sobra — você fecha o mês com alguma coisa guardada.',{ab:'res',t:'Abrir a reserva'});

  if(cats.length&&c.saiT>0){
    var top=cats[0], pt=top.valor/c.saiT*100;
    if(pt>30)
      add('at','<b>'+esc(top.nome)+'</b> sozinho é <b>'+n1(pt)+'%</b> das saídas ('+m(top.valor)+'). É aí que mexer tem mais efeito.',{ab:'rel',t:'Ver os relatórios'});
  }

  var ass=0;
  listaCartoes().forEach(function(cc){ (cc.recorrentes||[]).forEach(function(rr){ ass+=+rr.valor||0 }) });
  if(ass>0&&c.entT>0)
    add(ass/c.entT*100>8?'at':'ok','Assinaturas somam <b>'+m(ass)+'/mês</b> — '+m(ass*12)+' por ano, '+n1(ass/c.entT*100)+'% da renda. Vale revisar o que você realmente usa.',{ab:'cart',t:'Ver as assinaturas'});

  var ant=shift(k,-1);
  if(meses[ant]){
    var ca=calc(ant);
    if(ca.saiT>0){
      var dif=(c.saiT-ca.saiT)/ca.saiT*100;
      if(Math.abs(dif)>=12)
        add(dif>0?'at':'ok','Suas saídas '+(dif>0?'subiram':'caíram')+' <b>'+n1(Math.abs(dif))+'%</b> contra '+lblS(ant)+' ('+m(ca.saiT)+' → '+m(c.saiT)+').',{ab:'rel',t:'Ver os relatórios'});
    }
  }

  if(!out.length)
    add('ok','Mês sob controle: sobra de <b>'+m(c.disponivel)+'</b>, parcelas em '+n1(c.entT>0?pc.total/c.entT*100:0)+'% da renda.',{ab:'plano',t:'Abrir o plano'});

  var ord={rk:0,at:1,ok:2};
  out.sort(function(a,b){return ord[a.nv]-ord[b.nv]});
  return out.slice(0,3);
}

function chColunas(sr){

/* Cores das categorias. Precisam ser distinguíveis uma da outra — um degradê de
   um tom só embaralha as fatias vizinhas. O conjunto começa no verde da marca e
   na lima e abre para tons de mesma força, para a rosca parecer uma família. */
var CORESCAT=['#0B4A3C','#9FE870','#2E8B8B','#D3A82A','#CE4B40','#5B7FB0',
              '#8E6BB8','#5FA85A','#E08A50','#2F6E8F','#B5C44A','#9C5A74'];
function rampa(n){
  var out=[],i;
  for(i=0;i<n;i++) out.push(CORESCAT[i%CORESCAT.length]);
  return out;
}
function chDonut(cats,rot,vazio){
  if(!cats.length) return '<div class="empty">'+(vazio||'Sem saídas lançadas neste mês.')+'</div>';
  var cores=rampa(cats.length);
  var tot=cats.reduce(function(a,b){return a+b.valor},0)||1;
  var R=64,r=42,cx=74,cy=74,ang=-Math.PI/2;
  var s='<svg class="ch" viewBox="0 0 148 148" style="max-width:188px;margin:0 auto;min-width:0" role="img" aria-label="Gastos por categoria">';
  cats.forEach(function(c,i){
    var a2=ang+c.valor/tot*Math.PI*2, lg=(a2-ang)>Math.PI?1:0;
    var x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    var x3=cx+r*Math.cos(a2),y3=cy+r*Math.sin(a2),x4=cx+r*Math.cos(ang),y4=cy+r*Math.sin(ang);
    s+='<path d="M'+x1+' '+y1+' A'+R+' '+R+' 0 '+lg+' 1 '+x2+' '+y2+' L'+x3+' '+y3+' A'+r+' '+r+' 0 '+lg+' 0 '+x4+' '+y4+' Z" style="fill:'+cores[i%cores.length]+'"><title>'+esc(c.nome)+': '+m(c.valor)+' ('+n1(c.valor/tot*100)+'%)</title></path>';
    ang=a2;
  });
  s+='<text x="74" y="69" text-anchor="middle" style="font-size:9px;letter-spacing:.4px">'+(rot||'saídas')+'</text>'
   +'<text x="74" y="88" text-anchor="middle" style="font-size:17px;font-family:var(--fn);font-weight:600;fill:var(--ink)">'+kcur(tot)+'</text></svg>';
  s+='<div class="legend">'+cats.map(function(c,i){
    return '<span class="lg"><i style="background:'+cores[i%cores.length]+'"></i><span class="t">'+esc(c.nome)+'</span>'
      +'<span class="p">'+n1(c.valor/tot*100)+'%</span><span class="v">'+m(c.valor)+'</span></span>';
  }).join('')+'</div>';
  return s;
}

var DIA_SEL=(MES_BASE===MES_HOJE?hoje.getDate():0);
var DW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var DWL=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var ORG={lanc:'Lançamento',plano:'Plano do mês',fatura:'Fatura do cartão'};

/* tudo que tem data no sistema, reunido por dia */
function eventosDoMes(k){
  var ev={}, sem=[], d=meses[k]||{itens:[],pagos:{}}, nd=dim(k), pg=d.pagos||{};
  function add(dia,o){ dia=+dia; if(!(dia>=1&&dia<=nd))return; (ev[dia]=ev[dia]||[]).push(o) }
  lancs.forEach(function(l){ if((l.data||'').slice(0,7)!==k)return;
    add(l.data.slice(8,10),{tipo:l.tipo,nome:l.desc||'Sem descrição',valor:Math.abs(+l.valor||0),org:'lanc',feito:true,id:l.id}); });
  (d.itens||[]).forEach(function(i){
    var dia=i.auto5du?parseInt(diaUtil(k,5),10):(+i.dia||0);
    var r=realDe(i,pg);
    var o={tipo:i.tipo,nome:i.nome,valor:(r!=null?r:+i.valor||0),org:'plano',feito:r!=null,id:i.id,fixo:!!i.auto5du};
    if(dia)add(dia,o); else sem.push(o);
  });
  faturasDoMes(k).forEach(function(f){
    var o={tipo:'saida',nome:'Fatura '+f.c.nome,valor:(f.real!=null?f.real:f.plan),org:'fatura',feito:f.real!=null,id:f.c.id};
    if(f.c.venc)add(f.c.venc,o); else sem.push(o);
  });
  Object.keys(ev).forEach(function(x){ ev[x].sort(function(a,b){
    var oa=a.tipo==='entrada'?0:a.tipo==='reserva'?2:1, ob=b.tipo==='entrada'?0:b.tipo==='reserva'?2:1;
    return oa-ob||b.valor-a.valor }) });
  return {dias:ev,sem:sem,nd:nd};
}
function cl3(t){ return t==='entrada'?'e':t==='reserva'?'r':'s' }
function ic3(t){ return t==='entrada'?'↙':t==='reserva'?'◆':'↗' }
function netDia(l){ return (l||[]).reduce(function(a,o){ return a+(o.tipo==='entrada'?o.valor:-o.valor) },0) }

/* a linha logo abaixo do saldo: com a verba ligada ela mostra o limite de
   hoje, que é o número que a pessoa de fato usa para decidir. */
function subDia(c,dr){
  if(MES<MES_HOJE) return 'proje\u00e7\u00e3o do m\u00eas fechado';
  if(vdOn()){
    var v=vdPlano(MES);
    if(MES===MES_HOJE){
      var f=v.falta[v.hojeD];
      return (f>0?m(f)+' para gastar hoje':'o limite de hoje acabou')
        +' \u00b7 '+m(v.porDia)+' por dia nos pr\u00f3ximos';
    }
    return m(v.porDia)+' por dia nos '+v.nd+' dias do m\u00eas';
  }
  return m(c.disponivel/dr)+' por dia'+(MES===MES_HOJE?' nos '+dr+' dias que faltam':' nos '+dr+' dias do m\u00eas');
}

   +'<output for="vdP" id="vdPo">'+v.pct+'%</output></div>';

function chLinha(pts,mx){
  pts=pts.slice().sort(function(a,b){return a.mes.localeCompare(b.mes)});
  var W=Math.max(420,pts.length*32),H=168,pl=46,pr=12,pt=14,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  function X(i){return pl+(pts.length>1?iw*i/(pts.length-1):iw/2)}
  function Y(v){return pt+ih*(1-(mx>0?v/mx:0))}
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução da reserva">';
  [0,.5,1].forEach(function(f){var y=Y(mx*f);
    s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+kcur(mx*f)+'</text>'});
  var dp=pts.map(function(p,i){return (i?'L':'M')+X(i)+' '+Y(p.valor)}).join(' ');
  s+='<path d="'+dp+' L'+X(pts.length-1)+' '+Y(0)+' L'+X(0)+' '+Y(0)+' Z" fill="var(--azul)" opacity=".13"/>'
   +'<path d="'+dp+'" fill="none" stroke="var(--azul)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){
    if(i===pts.length-1) s+='<circle cx="'+X(i)+'" cy="'+Y(p.valor)+'" r="4.5" fill="var(--azul)"/>';
    if(i%Math.ceil(pts.length/6)===0||i===pts.length-1) s+='<text x="'+X(i)+'" y="'+(H-7)+'" text-anchor="middle">'+lblS(p.mes)+'</text>'; });
  return s+'</svg>';
}

function linkOk(u){ u=String(u||'').trim(); return /^https?:\/\//i.test(u)?u:'' }
function dominio(u){ try{ return String(u).replace(/^https?:\/\//i,'').split('/')[0].replace(/^www\./,'') }catch(e){ return 'link' } }

function custoTxt(d){ return d>=45 ? n1(d/30.44)+' meses' : n1(d)+' dias' }
function impacto(d,k){
  var nq=Math.max(1,Math.min(48,parseInt(d.parcelas,10)||1)), v=+d.valor||0;
  /* compra parcelada só entra na fatura do mês seguinte — à vista sai agora */
  var ini=(nq===1?k:shift(k,1));
  if(nq>1) mesDoc(ini);
  var c=calc(ini), pc=parcelasEm(ini);
  var parcela=r2(v/nq);
  var disp=c.disponivel;                       /* o que sobra no mês de referência */
  var dias=diasRest(ini), porDia=dias>0?disp/dias:0;
  var sobra=r2(disp-(nq===1?v:parcela));       /* à vista tira tudo; parcelado tira uma parcela */
  var antesPct=c.entT>0?pc.total/c.entT*100:0;
  var depoisPct=c.entT>0?(pc.total+(nq>1?parcela:0))/c.entT*100:0;
  var custoDias=porDia>0?v/porDia:0;
  var nivel,texto;
  if(sobra<0){ nivel='rk'; texto=(nq===1?'não cabe à vista':'não cabe'); }
  else if(nq>1&&depoisPct>30){ nivel='rk';
    texto=(antesPct>30?'orçamento já apertado':'passa dos 30%'); }
  else if(sobra<disp*0.25||(nq>1&&depoisPct>25)){ nivel='at'; texto='cabe, mas aperta'; }
  else { nivel='ok'; texto=(nq===1?'cabe à vista':'cabe'); }
  return {nq:nq,valor:v,parcela:parcela,disp:disp,sobra:sobra,antesPct:antesPct,depoisPct:depoisPct,
    custoDias:custoDias,ini:ini,fim:shift(ini,nq-1),nivel:nivel,texto:texto,porDia:porDia,adiado:(nq>1)};
}

  if(g.falta>0){

      h+='<div class="ln"><span>→</span><div>Para chegar em <b>'+lblS(mt.prazo)+'</b> ('+g.mesesPrazo+' '+(g.mesesPrazo===1?'mês':'meses')+'), guarde <b>'+m(g.porMes)+' por mês</b>'
       +(g.sobra>0?' — <b>'+n1(g.pesoSobra)+'%</b> da sobra deste mês':'')+'.'
       +(g.porMes>g.sobra&&g.sobra>0?' <b>Isso é mais do que sobra hoje</b>: ou o prazo estica, ou alguma saída cai.':'')+'</div></div>';
    } else if(g.atrasada){
      h+='<div class="ln"><span>⚠</span><div>O prazo de <b>'+lblS(mt.prazo)+'</b> já passou e ainda faltam <b>'+m(g.falta)+'</b>. Vale remarcar para uma data que caiba.</div></div>';
    }
    if(g.ritmo>0&&g.chegaRitmo){
      h+='<div class="ln"><span>◷</span><div>No seu ritmo real de <b>'+m(g.ritmo)+'/mês</b>, faltam '+g.noRitmo+' '+(g.noRitmo===1?'mês':'meses')+' — e <b>'+m(g.falta)+'</b>.</div></div>';
    } else if(g.sobra>0){
      h+='<div class="ln"><span>◷</span><div>Você ainda não aplicou nada, então não há ritmo para projetar. Guardando <b>'+m(g.sobra*0.2)+'/mês</b> levaria '+Math.ceil(g.falta/(g.sobra*0.2))+' meses.</div></div>';
    }
  }
  h+='</div><div class="acs2">'
   +'<button class="pr" data-ma="'+mt.id+'">Alvo</button>'
   +'<button data-mp="'+mt.id+'">Prazo</button>'
   +(mt.fonte==='manual'?'<button data-mg="'+mt.id+'">Guardado</button>':'')
   +'<button data-mx="'+mt.id+'">Remover</button></div>';
  return h+'</div>';
}

/* ===== Plano do ano: a estratégia escrita, comparada com o que de fato foi guardado ===== */
function blocoPlanoAno(){
  if(!planoAno||!planoAno.aportes) return '';
  var ap=planoAno.aportes, ks=Object.keys(ap).sort();
  var totR=0,totP=0,feito=0,prev=0;
  ks.forEach(function(k){
    totR+=+ap[k].res||0; totP+=+ap[k].pat||0;
    if(k<=MES_HOJE){ prev+=(+ap[k].res||0)+(+ap[k].pat||0); feito+=(meses[k]?calc(k).resT:0) }
  });
  var dif=r2(feito-prev), emDia=dif>=-50;
  var comecou=ks.filter(function(k){return k<=MES_HOJE}).length>0;

  var h='<div class="grid eq"><div class="card c12"><h2>Plano '+planoAno.ano+' <em>'+esc(planoAno.titulo||'')+'</em></h2>'
   +'<p class="sub" style="font-size:13px;line-height:1.6;color:var(--ink-2)">'+esc(planoAno.resumo||'')+'</p>'
   +'<div class="kpis">'
   +kpi('Reserva ao fim de '+planoAno.ano,m(totR),'somando os aportes do plano','var(--azul)')
   +kpi('Patrimônio ao fim',m(totP),'dinheiro de longo prazo','var(--verde)')
   +kpi('Guardado ao todo',m(totR+totP),'o que o ano deixa')
   +(comecou
      ? kpi(emDia?'No plano':'Atrás do plano',(dif>=0?'+ ':'− ')+m(Math.abs(dif)),
            'guardou '+m(feito)+' de '+m(prev)+' até agora',emDia?'var(--verde)':'var(--vermelho)')
      : kpi('Começa em '+lblS(ks[0]),m(ap[ks[0]].res+ap[ks[0]].pat),'o primeiro aporte','var(--ambar)'))
   +'</div>'
   +(planoAno.margem?'<div class="note" style="margin-top:12px"><span>◆</span><div>'+esc(planoAno.margem)+'</div></div>':'')
   +'</div></div><div class="grid">';

  /* fases */
  h+='<div class="card c5"><h2>As quatro fases</h2>';
  (planoAno.fases||[]).forEach(function(f){
    var ativa=(MES_HOJE>=f.de&&MES_HOJE<=f.ate);
    h+='<div class="fase'+(ativa?' ativa':'')+'"><div class="fh"><span class="fn">'+esc(f.nome)+'</span>'
     +'<span class="fp">'+lblS(f.de)+(f.de!==f.ate?' → '+lblS(f.ate):'')+'</span>'
     +(ativa?'<span class="tag ok">agora</span>':'')+'</div><p>'+esc(f.texto)+'</p></div>';
  });
  if(planoAno.revisao) h+='<div class="note wr" style="margin-top:4px"><span>◷</span><div>'+esc(planoAno.revisao)+'</div></div>';
  h+='</div>';

  /* mês a mês */
  h+='<div class="card c7"><h2>Mês a mês <em>plano × realizado</em></h2>'
   +'<p class="sub">“Livre” é o que sobra depois das contas fixas, das parcelas, dos compromissos novos e do seu dia a dia.</p>'
   +'<div class="scroll"><table class="tbl"><thead><tr><th>Mês</th><th>Livre</th><th>Reserva</th><th>Patrim.</th><th>Guardado</th></tr></thead><tbody>';
  ks.forEach(function(k){
    var a=ap[k], plan=(+a.res||0)+(+a.pat||0);
    var passou=(k<MES_HOJE), agora=(k===MES_HOJE);
    var real=(meses[k]?calc(k).resT:null);
    var cel;
    if(real==null||(!passou&&!agora)) cel='<span class="n">—</span>';
    else cel='<span class="'+(real>=plan-50?'ok':'ru')+'">'+m(real)+'</span>';
    h+='<tr class="'+(agora?'ag':passou?'pass':'')+'"><td>'+lblS(k)+'</td><td>'+m(a.livre)+'</td>'
     +'<td>'+(a.res?m(a.res):'<span class="n">—</span>')+'</td>'
     +'<td>'+(a.pat?m(a.pat):'<span class="n">—</span>')+'</td><td>'+cel+'</td></tr>';
  });
  h+='<tr><td><b>Total</b></td><td class="n">—</td><td><b>'+m(totR)+'</b></td><td><b>'+m(totP)+'</b></td><td><b>'+m(feito)+'</b></td></tr>';
  h+='</tbody></table></div></div></div>';

  /* onde pôr o dinheiro + premissas */
  h+='<div class="grid"><div class="card c7"><h2>Onde pôr cada dinheiro</h2><div class="ondeb" style="border-top:0;padding-top:0;margin-top:0">';
  (planoAno.onde||[]).forEach(function(o){ h+='<div><b>'+esc(o.t)+'</b><p>'+esc(o.d)+'</p></div>' });
  h+='</div><p class="sub" style="margin:4px 0 0">Não sou consultor de investimentos licenciado: isto é a estrutura e os prós e contras. A escolha do produto é sua, e vale conferir taxas e condições no banco ou na corretora antes de aplicar.</p></div>';

  h+='<div class="card c5"><h2>Em cima do que o plano está de pé</h2>'
   +'<p class="sub">Qualquer um destes mudar, me diga e eu refaço o ano.</p><div class="prem">';
  (planoAno.premissas||[]).forEach(function(x){
    h+='<span><b>'+esc(x.nome)+'</b>'+(x.valor?' '+m(x.valor):'')+'</span>';
  });
  h+='</div>';
  (planoAno.premissas||[]).filter(function(x){return x.obs}).forEach(function(x){
    h+='<p class="sub" style="margin:9px 0 0"><b style="color:var(--ink)">'+esc(x.nome)+'</b> — '+esc(x.obs)+'</p>';
  });
  return h+'</div></div>';
}

   +'<button class="btn" id="gS">Criar meta</button></div></div>';

function vRel(){
  var ks=Object.keys(meses).sort(), ano=MES.split('-')[0];
  var doAno=ks.filter(function(k){return k.indexOf(ano)===0&&k>=MES_MIN}), tE=0,tS=0,tR=0;
  var h='<div class="grid"><div class="card c12"><h2>Relatório de '+ano+'</h2><p class="sub">Cada mês registrado, com o saldo encadeado de um para o outro.</p><div class="scroll"><table class="tbl">'
   +'<tr><th>Mês</th><th>Entradas</th><th>Saídas</th><th>Faturas</th><th>Reserva</th><th>Sobra</th><th>% poupado</th></tr>';
  if(!doAno.length) h+='<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">Nenhum mês registrado em '+ano+'.</td></tr>';
  doAno.forEach(function(k){
    var c=calc(k), fs=faturasDoMes(k).reduce(function(a,f){return a+(f.real!=null?f.real:f.plan)},0);
    var tx=c.entT>0?c.resT/c.entT*100:0;
    tE+=c.entT;tS+=c.saiT;tR+=c.resT;
    h+='<tr><td><b>'+MN[+k.split('-')[1]-1]+'</b></td><td class="pos">'+m(c.entT)+'</td><td class="neg">'+m(c.saiT)+'</td>'
     +'<td>'+m(fs)+'</td><td>'+m(c.resT)+'</td><td class="'+(c.disponivel>=0?'pos':'neg')+'">'+m(c.disponivel)+'</td><td>'+n2(tx)+'%</td></tr>';
  });
  if(doAno.length) h+='<tr style="font-weight:800"><td><b>Total</b></td><td class="pos">'+m(tE)+'</td><td class="neg">'+m(tS)+'</td><td>—</td><td>'+m(tR)+'</td><td>—</td><td>'+(tE>0?n2(tR/tE*100):'0')+'%</td></tr>';
  h+='</table></div></div>';
  var sr=periodo();
  if(sr.length){
    var medE=sr.reduce(function(a,b){return a+b.c.entT},0)/sr.length;
    var medS=sr.reduce(function(a,b){return a+b.c.saiT},0)/sr.length;
    var medR=sr.reduce(function(a,b){return a+b.c.resT},0)/sr.length;
    h+='<div class="card c12"><h2>Médias <em>'+rotuloPeriodo()+'</em></h2><div class="kpis">'
     +kpi('Entradas / mês',m(medE),'média do período','var(--verde)')
     +kpi('Saídas / mês',m(medS),'média do período','var(--vermelho)')
     +kpi('Reserva / mês',m(medR),'média do período','var(--azul)')
     +kpi('Guardado',(medE>0?n2(medR/medE*100)+'%':'—'),'das entradas')+'</div></div>';
  }
  h+='<div class="card c12"><h2>Backup</h2>'
   +'<p class="sub">Baixa tudo o que está no sistema num único arquivo — meses, lançamentos, '
   +'dívidas, cartões, metas, desejos e o plano. Serve para guardar por segurança '
   +'e para levar os dados para outro navegador ou aparelho.</p>'
   +'<div class="bkl"><button data-bk="exp">Baixar backup</button>'
   +'<button data-bk="imp">Restaurar backup</button></div></div>';
  return h+'</div>';
}

function achaCart(id){ var i;
  for(i=0;i<cartoes.length;i++) if(cartoes[i].id===id) return cartoes[i];
  var c=null; listaCartoes().forEach(function(x){if(x.id===id)c=x});
  if(c){ c=copia(c); c.recorrentes=c.recorrentes||[]; cartoes.push(c); return c } return null }
function achaDiv(id){ for(var i=0;i<dividas.length;i++) if(dividas[i].id===id) return dividas[i]; return null }
function editaMes(el,atual,aplica){
  var inp=document.createElement('input');
  inp.type='month'; inp.className='rz'; inp.style.maxWidth='170px'; inp.min=MES_MIN; inp.value=atual||MES;
  el.replaceWith(inp); inp.focus();
  var done=false;
  function fim(){ if(done)return; done=true; if(/^\d{4}-\d{2}$/.test(inp.value))aplica(inp.value); render(); }
  inp.addEventListener('blur',fim);
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter')fim(); if(e.key==='Escape'){done=true;render()} });
}
function editaTexto(el,atual,aplica){
  var inp=document.createElement('input');
  inp.type='text'; inp.className='rz'; inp.style.textAlign='left'; inp.style.maxWidth='100%'; inp.value=atual;
  el.replaceWith(inp); inp.focus(); inp.select();

}

function wire(){
  if(!wire.b){ wire.b=true;
    document.body.addEventListener('click',function(ev){
      if(ev.target.closest('#btnMais')){ ev.stopPropagation(); abreMais(document.getElementById('maisM').hidden); return; }
      if(ev.target.closest('[data-olho]')){ ev.stopPropagation(); alternaOlho(); return; }
      var nb=ev.target.closest('[data-ab]');
      if(nb){ ABA=nb.dataset.ab; fechaFolhas(); window.scrollTo(0,0); render(); return; }
      var op=ev.target.closest('[data-abrir]');
      if(op){ ABERTO={}; ABERTO[op.dataset.abrir]=true; ABA='cart'; window.scrollTo(0,0); render(); return; }
      var g=ev.target.closest('[data-go]');
      if(g){ ABA=g.dataset.go; window.scrollTo(0,0); render();
        var lt=document.getElementById('lT'); if(lt&&g.dataset.tp){lt.value=g.dataset.tp; var lv=document.getElementById('lV'); if(lv)lv.focus();} return; }
      var ex=ev.target.closest('[data-ex]');
      if(ex){ var cid=ex.dataset.ex; ABERTO[cid]=!ABERTO[cid]; render(); return; }
      var t=ev.target.closest('[data-pg],[data-del],[data-ed],[data-dl],[data-dd],[data-dr],[data-pm],[data-qt],[data-fp],[data-fe],[data-de],[data-dn],[data-dq],[data-re],[data-rn],[data-rd],[data-ra],[data-fz],[data-cor],[data-arq],[data-pri],[data-ns],[data-in],[data-ia],[data-iv],[data-id2],[data-cd],[data-dc],[data-wn],[data-wv],[data-wq],[data-wx],[data-wc],[data-mn],[data-ma],[data-mp],[data-mg],[data-mx],[data-si],[data-dd],[data-insx],[data-insv],[data-vd]');
      if(!t||t.disabled)return;
      var d=mesDoc(MES), x, par, c;
      if(t.dataset.vd){ var lig=(t.dataset.vd==='on');
        antes('gasto diário automático','cfg');
        cfg.vdAuto=lig; if(cfg.vdPct==null)cfg.vdPct=80;
        save('config/app',cfg,false); render();
        toast(lig?'Gasto diário no automático':'Voltou para o dia a dia fixo');
        return; }
      if(t.dataset.cd){ var dsel=+t.dataset.cd; DIA_SEL=(DIA_SEL===dsel?0:dsel); render(); return; }
      if(t.dataset.dc){ var itc=d.itens.filter(function(i){return i.id===t.dataset.dc})[0]; if(!itc)return;
        antes('dia do compromisso','mes'); delete itc.dia; saveMes(MES,'Tirado do dia'); render(); return; }
      if(t.dataset.pg){ var id=t.dataset.pg, it=d.itens.filter(function(i){return i.id===id})[0]; if(!it)return;
        antes('confirmação da linha','mes');
        if(realDe(it,d.pagos)!=null){ delete d.pagos[id]; it.real=null; toast('Linha em aberto'); }
        else { d.pagos[id]=true; it.real=null; toast('Confirmado pelo planejado'); }
        saveMes(MES,false); render(); }
      else if(t.dataset.fp){ c=t.dataset.fp; var f0=fatura(achaCart(c)||{id:c,nome:c,recorrentes:[]},MES);
        antes('confirmação da fatura','mes');
        if(!d.faturas[c])d.faturas[c]={};
        if(f0.real!=null){ delete d.faturas[c].real; toast('Fatura em aberto'); }
        else { d.faturas[c].real=f0.plan; toast('Fatura confirmada'); }
        saveMes(MES,false); render(); }
      else if(t.dataset.fe){ c=t.dataset.fe; var fx=fatura(achaCart(c)||{id:c,nome:c,recorrentes:[]},MES);
        editaNum(t,fx.plan,function(v){ antes('fatura planejada','mes'); if(!d.faturas[c])d.faturas[c]={}; d.faturas[c].plan=v; saveMes(MES,'Fatura planejada salva') }); }
      else if(t.dataset.fz){ c=t.dataset.fz; antes('ajuste da fatura','mes'); if(d.faturas[c]){delete d.faturas[c].plan} saveMes(MES,'Voltou ao valor calculado'); render(); }
      else if(t.dataset.del){ antes('remoção da linha','mes'); d.itens=d.itens.filter(function(i){return i.id!==t.dataset.del}); delete d.pagos[t.dataset.del]; saveMes(MES,'Linha removida'); render(); }
      else if(t.dataset.ed){ var it2=d.itens.filter(function(i){return i.id===t.dataset.ed})[0]; if(!it2)return;
        editaNum(t,it2.valor,function(v){ antes('valor planejado','mes'); it2.valor=v; saveMes(MES,'Planejado salvo') }); }
      else if(t.dataset.dl){ var li=t.dataset.dl; antes('remoção do lançamento','lanc'); lancs=lancs.filter(function(l){return l.id!==li});
        if(DB)DB.doc(PX()+'lancamentos/'+li).delete().then(function(){toast('Lançamento removido')}).catch(function(){}); render(); }
      else if(t.dataset.dd){ antes('remoção do compromisso','div'); dividas=dividas.filter(function(y){return y.id!==t.dataset.dd}); saveDiv('Compromisso removido'); render(); }
      else if(t.dataset.dr){ antes('remoção do registro de reserva','res'); reserva=reserva.filter(function(y){return y.mes!==t.dataset.dr}); save('reserva/historico',{pontos:reserva},'Registro removido'); render(); }
      else if(t.dataset.pm){ x=achaDiv(t.dataset.pm); if(!x)return;
        antes('marcação da parcela','div');
        if(!x.pagas)x.pagas={};
        if(x.pagas[MES])delete x.pagas[MES]; else x.pagas[MES]=true;
        saveDiv(x.pagas[MES]?'Parcela de '+lbl(MES)+' paga':'Parcela desmarcada'); render(); }
      else if(t.dataset.qt){ x=achaDiv(t.dataset.qt); if(!x)return;
        antes(x.quitado?'reabertura de '+x.nome:'quitação de '+x.nome,'div');

/* ===== paleta de cores: um tom define toda a interface ===== */
function hx(n){ n=Math.round(Math.max(0,Math.min(255,n))); return (n<16?'0':'')+n.toString(16) }
function HSL(h,s,l){
  h=((h%360)+360)%360; s=Math.max(0,Math.min(100,s))/100; l=Math.max(0,Math.min(100,l))/100;
  var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, r,g,b;
  if(h<60){r=c;g=x;b=0} else if(h<120){r=x;g=c;b=0} else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c} else if(h<300){r=x;g=0;b=c} else {r=c;g=0;b=x}
  return '#'+hx((r+m)*255)+hx((g+m)*255)+hx((b+m)*255);
}
function rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)] }
function lum(c){ var a=rgb(c).map(function(v){v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*a[0]+.7152*a[1]+.0722*a[2] }
function ctr(a,b){ var x=lum(a),y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05) }
/* acha o L que garante contraste alvo contra uma base, andando na direção dada */
/* acha o L em que a cor contrasta com TODAS as bases ao mesmo tempo */
function solveL(h,s,bases,alvos,dir,L0){
  var L=L0,i,j,ok;
  for(i=0;i<80;i++){ ok=true;
    for(j=0;j<bases.length;j++) if(ctr(HSL(h,s,L),bases[j])<alvos[j]){ok=false;break}
    if(ok)return L; L+=dir; if(L<4||L>96)break }
  return Math.max(4,Math.min(96,L));
}
function hexToHS(hex){
  var p=rgb(hex).map(function(v){return v/255}), mx=Math.max.apply(null,p), mn=Math.min.apply(null,p),
      d=mx-mn, l=(mx+mn)/2, h=0, s=d===0?0:d/(1-Math.abs(2*l-1));
  if(d){ if(mx===p[0])h=60*(((p[1]-p[2])/d)%6); else if(mx===p[1])h=60*((p[2]-p[0])/d+2); else h=60*((p[0]-p[1])/d+4) }
  return {h:((h%360)+360)%360, s:Math.max(18,Math.min(100,Math.round(s*100))), l:Math.round(l*100)};
}

/* ======================================================================
   ARMAZENAMENTO EM DUAS CAMADAS
   Quem tem permissão de gravar no banco do artefato (o dono da página e quem
   ele convida como editor) guarda em data/users/<id>/dados/ — uma área privada
   que nenhum outro visitante lê, nem o dono.
   Quem abre só pelo link tem nível de leitura: o servidor recusa qualquer
   escrita, até na área própria. Para essa pessoa o sistema guarda no
   armazenamento do próprio navegador, com a mesma interface.
   Assim o mesmo link serve para várias pessoas e nenhuma vê a outra.

function LocalDB(){

    return {id:p.split('/').pop(), exists:!!d, data:function(){ return d?copia(d):undefined },
      metadata:{fromCache:false,hasPendingWrites:false}}; }
  function sCol(p){ var pre=p+'/';
    var ids=Object.keys(mem).filter(function(k){
      return k.indexOf(pre)===0 && k.slice(pre.length).indexOf('/')<0 }).sort();
    return {docs:ids.map(function(k){return sDoc(k)}), size:ids.length, empty:!ids.length,
      docChanges:function(){ return [] }, metadata:{fromCache:false,hasPendingWrites:false}}; }
  function liga(e){ subs.push(e);
    var t=setTimeout(function(){ e.fn() },0);
    return function(){ clearTimeout(t); var i=subs.indexOf(e); if(i>=0)subs.splice(i,1) }; }
  /* avisa só quem observa o caminho escrito: uma gravação não redesenha nove vezes */
  function avisa(p){ subs.slice().forEach(function(e){
    var bate = e.col ? (p.indexOf(e.p+'/')===0 && p.slice(e.p.length+1).indexOf('/')<0)
                     : (e.p===p);
    if(bate){ try{ e.fn() }catch(x){} } }); }
  function cheio(){ return Promise.reject({code:'quota_exceeded',message:'armazenamento cheio'}) }
  function docRef(p){ return {
    path:p, id:p.split('/').pop(),
    get:function(){ return Promise.resolve(sDoc(p)) },
    set:function(b){ var a=mem[p]; mem[p]=copia(b);
      try{ grava() }catch(e){ if(a===undefined)delete mem[p]; else mem[p]=a; return cheio() }
      avisa(p); return Promise.resolve() },
    update:function(b){ var a=mem[p], n=copia(mem[p]||{});
      Object.keys(b).forEach(function(k){ n[k]=b[k] }); mem[p]=n;
      try{ grava() }catch(e){ if(a===undefined)delete mem[p]; else mem[p]=a; return cheio() }
      avisa(p); return Promise.resolve() },
    delete:function(){ delete mem[p]; try{ grava() }catch(e){} avisa(p); return Promise.resolve() },
    onSnapshot:function(next){ return liga({p:p,col:false,fn:function(){ next(sDoc(p)) }}) },
    collection:function(sp){ return colRef(p+'/'+sp) } }; }
  function colRef(p){ var q={ path:p,
    limit:function(){ return q }, where:function(){ return q }, orderBy:function(){ return q },
    get:function(){ return Promise.resolve(sCol(p)) },
    onSnapshot:function(next){ return liga({p:p,col:true,fn:function(){ next(sCol(p)) }}) },
    doc:function(id){ return docRef(p+'/'+(id||uid())) },
    add:function(b){ var r=docRef(p+'/'+uid()); return r.set(b).then(function(){ return r }) } };
    return q; }
  return { local:true, doc:docRef, collection:colRef };
}

/* ===== Backup: serve nos dois modos, inclusive para levar os dados de um para o outro ===== */

/* ----------------------------------------------------------------------
   Backup de TODOS os perfis
   O pacote antigo (sem `perfisDados`) continua valendo: so restaura o perfil
   em uso, como sempre fez.
   ---------------------------------------------------------------------- */
function prefixoDe(id){ return RAIZ+(id==='principal'?'':'p/'+id+'/') }

/* le um perfil inteiro do banco, no formato do pacote */
function lePerfil(id){
  if(!DB) return Promise.resolve(null);
  var px=prefixoDe(id), out={meses:{},lancamentos:[],dividas:[],cartoes:[],
    metas:[],desejos:[],investimentos:[],plano:null,reserva:[]};
  function col(n){ return DB.collection(px+n).get().catch(function(){ return {docs:[]} }) }
  function doc(p){ return DB.doc(px+p).get().catch(function(){ return {exists:false} }) }
  return Promise.all([col('meses'),col('lancamentos'),doc('plano/anual'),
                      doc('reserva/historico')].concat(
      ['dividas','cartoes','metas','desejos','investimentos'].map(function(n){ return doc(n+'/lista') })))
  .then(function(r){
    (r[0].docs||[]).forEach(function(d){ out.meses[d.id]=d.data() });
    (r[1].docs||[]).forEach(function(d){ var o=d.data()||{}; if(!o.id)o.id=d.id; out.lancamentos.push(o) });
    if(r[2]&&r[2].exists) out.plano=r[2].data();
    if(r[3]&&r[3].exists) out.reserva=(r[3].data()||{}).pontos||[];
    ['dividas','cartoes','metas','desejos','investimentos'].forEach(function(n,i){
      var d=r[4+i]; out[n]=(d&&d.exists&&(d.data()||{}).itens)||[] });
    return out;
  });
}

/* grava um perfil inteiro no banco, a partir do formato do pacote */
function gravaPerfil(id,o){
  if(!DB||!o) return Promise.resolve();
  var px=prefixoDe(id), ps=[];
  function põe(p,b){ ps.push(DB.doc(px+p).set(b).catch(function(){})) }
  Object.keys(o.meses||{}).forEach(function(k){ põe('meses/'+k,o.meses[k]) });
  (o.lancamentos||[]).forEach(function(l){ if(l&&l.id) põe('lancamentos/'+l.id,l) });
  ['dividas','cartoes','metas','desejos','investimentos'].forEach(function(n){ põe(n+'/lista',{itens:o[n]||[]}) });
  põe('reserva/historico',{pontos:o.reserva||[]});
  if(o.plano) põe('plano/anual',o.plano);
  return Promise.all(ps);
}

  return { app:'traction-finance', v:1, quando:new Date().toISOString(),
    cfg:cfg, perfis:perfis, meses:meses, lancamentos:lancs, dividas:dividas,
    cartoes:cartoes, metas:metas, desejos:desejos, investimentos:investimentos,

function baixaDireto(txt,nome){
  try{
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    a.download=nome; document.body.appendChild(a); a.click();
    setTimeout(function(){ try{URL.revokeObjectURL(a.href)}catch(e){} a.remove() },2000);

function exportaDados(){
  var nome='traction-finance-'+HOJE_ISO+'.json';
  /* os perfis que nao estao abertos vem do banco antes de fechar o pacote */
  var outros=perfis.filter(function(x){ return x.id!==PERFIL });
  Promise.all(outros.map(function(x){ return lePerfil(x.id).catch(function(){ return null }) }))
  .then(function(rs){
    var o=pacote();
    o.perfisDados={};
    outros.forEach(function(x,i){ if(rs[i]) o.perfisDados[x.id]=rs[i] });
    var txt=JSON.stringify(o,null,1);
    var p=(typeof claude!=='undefined'&&claude&&claude.use)?claude.use('downloads'):Promise.resolve(null);
    return Promise.resolve(p).then(function(d){
      if(d&&d.save) return d.save({filename:nome,data:txt}).then(function(){ toast('Backup salvo') });
      baixaDireto(txt,nome);
    }).catch(function(){ baixaDireto(txt,nome) });
  }).catch(function(){ baixaDireto(JSON.stringify(pacote(),null,1),nome) });
}
function importaDados(txt){
  var o=null; try{ o=JSON.parse(txt) }catch(e){}
  if(!o||typeof o!=='object'||!o.cfg){ toast('Esse arquivo não é um backup do Traction Finance'); return }
  cfg=o.cfg||cfg; if(cfg.mesInicial)MES_MIN=cfg.mesInicial;
  if(o.perfis&&o.perfis.length)perfis=o.perfis;
  meses=o.meses||{}; lancs=o.lancamentos||[]; dividas=o.dividas||[]; cartoes=o.cartoes||[];
  metas=o.metas||[]; desejos=o.desejos||[]; investimentos=o.investimentos||[];
  planoAno=o.plano||null; reserva=o.reserva||[];
  save('config/app',cfg,false); savePerfis(); saveDiv(false); saveCart(false);
  saveMet(false); saveDej(false); saveInv(false);
  save('reserva/historico',{pontos:reserva},false);
  if(planoAno)save('plano/anual',planoAno,false);
  Object.keys(meses).forEach(function(k){ saveMes(k,false) });
  lancs.forEach(function(l){ if(l&&l.id)save('lancamentos/'+l.id,l,false) });
  /* os demais perfis vao cada um para o seu proprio espaco */
  var pd=o.perfisDados||{};
  Object.keys(pd).forEach(function(id){ if(id!==PERFIL) gravaPerfil(id,pd[id]) });
  fechaCadastro(); toast('Backup restaurado'); render();
}

/* Dinheiro entra como texto. Um input type=number descarta "1.300,50", que e como
   a maioria das pessoas digita aqui; numBR() interpreta virgula e ponto. */
function numBR(t){
  t=String(t==null?'':t).replace(/[^0-9.,]/g,'');
  if(!t)return 0;
  var c=t.lastIndexOf(','), d=t.lastIndexOf('.');
  if(c>d) t=t.replace(/\./g,'').replace(',','.');        /* 1.300,50 */
  else if(d>c) t=t.replace(/,/g,'');                     /* 1,300.50 */
  else t=t.replace(',','.');                             /* 1300,50 ou 1300.50 */
  var v=parseFloat(t);
  return isFinite(v)&&v>0?r2(v):0;
}

/* O painel fala com o armazenamento por doc/collection/onSnapshot — a mesma
   interface do Firestore — entao este adaptador e so uma tradução fina. */
function adaptaFirestore(fs,F){
  function snapD(d){ return {id:d.id, exists:d.exists(),
    data:function(){ return d.exists()?d.data():undefined },
    metadata:{fromCache:false,hasPendingWrites:false}}; }
  function snapC(q){ return {docs:q.docs.map(snapD), size:q.size, empty:q.empty,
    docChanges:function(){ return [] }, metadata:{fromCache:false,hasPendingWrites:false}}; }
  function docRef(p){ var r=F.doc(fs,p); return {
    path:p, id:r.id,
    get:function(){ return F.getDoc(r).then(snapD) },
    set:function(b){ return F.setDoc(r,b) },
    update:function(b){ return F.updateDoc(r,b) },
    delete:function(){ return F.deleteDoc(r) },
    onSnapshot:function(next,err){ return F.onSnapshot(r,function(d){ next(snapD(d)) },
      function(e){ if(err)err({code:(e&&e.code)||'unavailable',message:String(e&&e.message||e)}) }) },
    collection:function(sp){ return colRef(p+'/'+sp) } }; }
  function colRef(p){ var lim=0;
    function alvo(){ var c=F.collection(fs,p); return lim?F.query(c,F.limit(lim)):c }
    var q={ path:p,
      limit:function(n){ lim=n; return q },
      where:function(){ return q }, orderBy:function(){ return q },
      get:function(){ return F.getDocs(alvo()).then(snapC) },
      onSnapshot:function(next,err){ return F.onSnapshot(alvo(),function(x){ next(snapC(x)) },
        function(e){ if(err)err({code:(e&&e.code)||'unavailable',message:String(e&&e.message||e)}) }) },
      doc:function(id){ return docRef(p+'/'+(id||uid())) } };
    return q; }
  return { doc:docRef, collection:colRef };
}
