     +(modo!=='esqueci'?('<label class="cadl" for="lgS"><span>Senha</span>'
       +'<input id="lgS" type="password" autocomplete="'+(modo==='criar'?'new-password':'current-password')
       +'" placeholder="'+pe+'"></label>'):'')
     +'<button class="cadb" id="lgOk">'+rot+'</button>'
     +'<p class="cadn">'+alt+'</p></div>';
    var e=d.querySelector('#lgE'); if(e)e.focus();
  }

  function trava(t){ var b=d.querySelector('#lgOk'); if(!b)return;
    b.disabled=t; b.textContent=t?'Um instante\u2026':b.textContent; }

  function envia(){
    var em=String((d.querySelector('#lgE')||{}).value||'').trim();
    var se=String((d.querySelector('#lgS')||{}).value||'');
    if(!em){ msg='Falta o e-mail.'; bom=''; pinta(); return }
    trava(true); msg=''; bom='';
    var p = modo==='entrar' ? A.signInWithEmailAndPassword(auth,em,se)
          : modo==='criar'  ? A.createUserWithEmailAndPassword(auth,em,se)
          :                   A.sendPasswordResetEmail(auth,em);
    p.then(function(){
      if(modo==='esqueci'){ modo='entrar'; bom='Link enviado. Olhe a sua caixa de entrada.'; pinta() }
      /* entrar e criar: o onAuthStateChanged assume daqui */
    }).catch(function(e){ msg=erroPT(e&&e.code); bom=''; pinta() });
  }

  d.addEventListener('click',function(ev){
    var a=ev.target.closest('[data-lg]');
    if(a){ modo=a.dataset.lg; msg=''; bom=''; pinta(); return }
    if(ev.target.closest('#lgOk')) envia();
  });
  d.addEventListener('keydown',function(ev){ if(ev.key==='Enter')envia() });
  pinta();
}

/* Conta criada, mas o e-mail ainda nao esta na lista do beta: quem decide isso
   e a regra do Firestore, entao a recusa da gravacao e a propria resposta. */
function telaEspera(A,auth,em){
  fechaLogin();
  var d=document.createElement('div'); d.id='logw'; d.className='cadw';
  d.innerHTML='<div class="cadc">'
   +'<div class="logo" role="img" aria-label="Traction Finance"><span class="cap">Traction</span><span class="dsc">Finance</span></div>'
   +'<h2>Sua conta foi criada</h2>'
   +'<p class="cadp">S\u00f3 que <b>'+esc(em||'esse e-mail')+'</b> ainda n\u00e3o est\u00e1 na lista do beta, '
   +'ent\u00e3o o painel n\u00e3o consegue guardar nada por enquanto. Avise quem te convidou \u2014 '
   +'assim que o e-mail for liberado, \u00e9 s\u00f3 entrar de novo.</p>'
   +'<button class="cadb" id="lgSair">Sair</button></div>';
  document.body.appendChild(d);
  d.querySelector('#lgSair').onclick=function(){ A.signOut(auth) };
}

function sair(){
  if(!FBA||!FBAUTH)return;
  FBA.signOut(FBAUTH).catch(function(){ toast('N\u00e3o deu para sair agora') });
}

/* Limpa tudo o que estava na tela quando a sess\u00e3o termina: sem isto os n\u00fameros
   de uma conta ficariam vis\u00edveis por um instante para a pr\u00f3xima. */
function desmonta(){
  desliga.forEach(function(f){ try{f()}catch(e){} }); desliga=[];
  if(desligaPf){ try{desligaPf()}catch(e){} desligaPf=null }
  DB=null; EMAIL=''; RAIZ='';
  cfg={metaReserva:10000,reservaAtual:0,nome:''};
  perfis=[{id:'principal',nome:'Minha conta',cor:'azul'}]; PERFIL='principal';
  meses={}; mesesLocais={}; lancs=[]; dividas=[]; cartoes=[];
  investimentos=[]; desejos=[]; metas=[]; planoAno=null; reserva=[];
  ABA='geral'; fechaCadastro(); fechaEscolha(); PERFIL_ESCOLHIDO=false; fechaFolhas();
  view.innerHTML='';
}

function abreFeedback(){
  if(document.getElementById('fbw'))return;
  var d=document.createElement('div'); d.id='fbw'; d.className='cadw';
  d.innerHTML='<div class="cadc"><h2>Como est\u00e1 sendo usar isto?</h2>'
   +'<p class="cadp">O que atrapalhou, o que faltou, o que voc\u00ea esperava que acontecesse e n\u00e3o aconteceu. '
   +'Pode escrever do jeito que vier.</p>'
   +'<textarea class="cadt" id="fbT" placeholder="Escreva aqui"></textarea>'
   +'<button class="cadb" id="fbOk" style="margin-top:11px">Enviar</button>'
   +'<p class="cadn"><button class="lgalt" id="fbX">Agora n\u00e3o</button></p></div>';
  document.body.appendChild(d);
  d.querySelector('#fbT').focus();
  d.querySelector('#fbX').onclick=function(){ d.remove() };
  d.querySelector('#fbOk').onclick=function(){
    var t=String(d.querySelector('#fbT').value||'').trim();
    if(!t){ toast('Escreva alguma coisa primeiro'); return }
    if(!DB){ toast('Sem conex\u00e3o agora'); return }
    DB.doc('feedback/'+uid()).set({ texto:t.slice(0,4000), email:EMAIL,
      quando:new Date().toISOString(), aba:ABA, tela:(innerWidth+'x'+innerHeight) })
      .then(function(){ d.remove(); toast('Recebido. Obrigado.') })
      .catch(function(){ toast('N\u00e3o deu para enviar agora') });
  };
}

function modoSite(){
  Promise.all([fbMod('app'),fbMod('auth'),fbMod('firestore')]).then(function(m){
    var app=m[0].initializeApp(FB), A=m[1], Fs=m[2];
    var auth=A.getAuth(app), fs=Fs.getFirestore(app);
    FBA=A; FBAUTH=auth; SITE=true;
    A.onAuthStateChanged(auth,function(u){
      desmonta();
      if(!u){ abreLogin(A,auth); return }
      EMAIL=u.email||'';
      var r='usuarios/'+u.uid+'/painel/dados/', ad=adaptaFirestore(fs,Fs);
      /* a regra do Firestore e a lista do beta: se a gravacao passa, esta liberado */
      ad.doc(r+'meta/acesso').set({visto:new Date().toISOString()}).then(function(){
        DB=ad; RAIZ=r; LOCAL=false; fechaLogin(); inicia();
      }).catch(function(){ telaEspera(A,auth,u.email) });
    });
  }).catch(function(e){
    console.warn('firebase',e);
    view.insertAdjacentHTML('afterbegin','<div class="note al"><span>\u26a0</span><div>'
     +'<b>N\u00e3o deu para falar com o servidor.</b> Recarregue a p\u00e1gina; '
     +'se continuar, pode ser a sua conex\u00e3o.</div></div>');
  });
}


/* ======================================================================
   ESCOLHA DE PERFIL
   Abre antes do painel quando a conta tem mais de um perfil. Com um só não
   há o que escolher, então ela nem aparece \u2014 é o caso de quem está
   começando agora.
   ====================================================================== */
var PERFIL_ESCOLHIDO=false;
function fechaEscolha(){ var d=document.getElementById('escw'); if(d)d.remove() }
function abreEscolha(){
  if(document.getElementById('escw'))return;
  var d=document.createElement('div'); d.id='escw'; d.className='cadw';
  var h=hoje.getHours();
  d.innerHTML='<div class="cadc"><div class="passo">'
   +'<div class="logo" role="img" aria-label="Traction Finance"><span class="cap">Traction</span><span class="dsc">Finance</span></div>'
   +'<h2>'+(h<12?'Bom dia':h<18?'Boa tarde':'Boa noite')+'. Qual perfil?</h2>'
   +'<p class="cadp">Cada perfil guarda meses, cartões, dívidas, reserva e metas separados. '
   +'Dá para trocar depois pelo canto de baixo da barra lateral.</p>'
   +'<div class="pfgrid">'
   + perfis.map(function(x){
       return '<button class="pfe" data-pe="'+esc(x.id)+'" aria-current="'+(x.id===PERFIL?'true':'false')+'">'
        +'<span class="av3" style="background:'+grad({cor:x.cor})+'" aria-hidden="true">'+esc(iniciais(x.nome))+'</span>'
        +'<span class="tx3"><span class="nm3">'+esc(x.nome)+'</span>'
        +'<span class="sb3">'+(x.id==='principal'?'Conta pessoal':'Perfil de cliente')
        +(x.id===PERFIL?' · em uso':'')+'</span></span></button>';
     }).join('')
   +'</div>'
   +'<p class="cadn"><button class="lgalt" id="escNovo">Criar um perfil</button></p>'
   +'</div></div>';
  document.body.appendChild(d);
  var pri=d.querySelector('.pfe[aria-current="true"]')||d.querySelector('.pfe');
  if(pri)pri.focus();
  d.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-pe]');
    if(b){ var id=b.dataset.pe; fechaEscolha();
      if(id!==PERFIL) trocaPerfil(id); else render();
      return; }
    if(ev.target.closest('#escNovo')){
      var nm=prompt('Nome do novo perfil');
      if(!nm||!String(nm).trim())return;
      nm=String(nm).trim();
      var nid=slug(nm); if(perfis.filter(function(z){return z.id===nid}).length) nid=nid+'-'+uid().slice(-4);
      var cores=['azul','verde','roxo','laranja','vermelho','rosa','grafite','cinza'];
      perfis.push({id:nid,nome:nm,cor:cores[perfis.length%cores.length]});
      savePerfis(); fechaEscolha(); trocaPerfil(nid);
    }
  });
}
/* chamada quando a lista de perfis chega do armazenamento */
function talvezEscolher(){
  if(PERFIL_ESCOLHIDO)return;
  if(document.getElementById('cadw')||document.getElementById('logw'))return;
  PERFIL_ESCOLHIDO=true;
  if(perfis.length<2)return;      /* um perfil só: não há escolha a fazer */
  abreEscolha();
}

/* ===== Liga o painel na camada escolhida ===== */
var desligaPf=null;
function inicia(){
  if(desligaPf){ try{desligaPf()}catch(e){} desligaPf=null }
  desligaPf=DB.doc(RAIZ+'perfis/lista').onSnapshot(function(s){
    if(s.exists&&(copia(s.data()).itens||[]).length) perfis=copia(s.data()).itens;
    if(!perfis.filter(function(z){return z.id===PERFIL}).length){
      PERFIL='principal'; try{localStorage.setItem('pf-perfil','principal')}catch(e){} }
    render();
    talvezEscolher();
  },function(){});
  conecta();
  checaCadastro();
}
function temLocal(){
  try{ localStorage.setItem('pf-t','1'); localStorage.removeItem('pf-t'); return true }catch(e){ return false }
}
function modoLocal(){
  if(!temLocal()){
    view.insertAdjacentHTML('afterbegin','<div class="note al"><span>⚠</span><div>'
     +'<b>Este navegador está bloqueando o armazenamento</b>, então nada do que você digitar '
     +'vai ficar salvo. Libere os dados de site para este endereço e recarregue a página.</div></div>');
    return;
  }
  LOCAL=true; RAIZ=''; DB=LocalDB(); inicia();
}
function usaBanco(db,id){ LOCAL=false; DB=db; RAIZ='data/users/'+id+'/dados/'; inicia() }

/* Dentro do Claude, manda a camada do artefato; fora dele (site publicado),
   o modo site com e-mail e senha. Assim o mesmo arquivo serve aos dois. */
if((typeof claude!=='undefined'&&claude&&claude.use)||!(FB&&FB.apiKey)){ ligaArtefato(); }
else { modoSite(); }

function ligaArtefato(){
var temClaude=(typeof claude!=='undefined'&&claude&&claude.use);
Promise.all([ temClaude?claude.use('db'):null, temClaude?claude.use('user'):null ])
.then(function(r){
  var db=r[0], u=r[1];
  if(!db||!u){ modoLocal(); return }
  return Promise.resolve(u.id()).then(function(id){
    if(!id){ modoLocal(); return }
    var ck='pf-modo-'+id, cache=null;
    try{ cache=localStorage.getItem(ck) }catch(e){}
    if(cache==='db'){ usaBanco(db,id); return }
    /* o nível de escrita só se descobre tentando: quem abre pelo link não grava
       nem na área própria. A resposta fica guardada para não repetir a cada abertura. */
    if(cache&&cache.indexOf('local|')===0 && (Date.now()-(+cache.slice(6)||0))<2592e5){ modoLocal(); return }
    return db.doc('data/users/'+id+'/dados/meta/acesso').set({visto:new Date().toISOString()})
      .then(function(){ try{localStorage.setItem(ck,'db')}catch(e){} usaBanco(db,id) })
      .catch(function(){ try{localStorage.setItem(ck,'local|'+Date.now())}catch(e){} modoLocal() });
  });
}).catch(function(){ modoLocal() });
}
})();
</script>

<script>
/* Instalação como app. O service worker só existe no site publicado:
   em file:// e dentro do artefato o navegador recusa, e o try/catch
   deixa a página seguir normalmente. */
(function(){
  if(!('serviceWorker' in navigator)) return;
  if(!window.isSecureContext) return;   /* https e localhost sim; file:// nao */
  window.addEventListener('load',function(){
    try{ navigator.serviceWorker.register('./sw.js').catch(function(){}) }catch(e){}
  });
})();
</script>
